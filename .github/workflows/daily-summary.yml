name: Daily CRM Summary Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: pip install --quiet matplotlib
      - name: Extract CRM data
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/extract-crm-data.js > /tmp/crm-data.json
      - name: Build report
        run: |
          mkdir -p data/reports
          python3 scripts/daily_summary.py /tmp/crm-data.json "data/reports/summary-$(date -u +%Y-%m-%d-%H%M%S).pdf"
      - name: Commit report
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/reports data/summary-reports.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "summary: report $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent run of this workflow) — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push daily-summary results after 3 attempts, likely racing a concurrent run of this same workflow (e.g. the manual button and a scheduled/API trigger firing close together). This run's findings were not saved, but the concurrency guard means it won't happen from overlapping scheduled runs alone, and any real update will likely resurface in the next scan."

