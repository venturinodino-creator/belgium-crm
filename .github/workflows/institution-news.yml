name: Daily Institution News Scan

# Runs just after the tender scan. Institutions announce CRIS and
# research-system decisions on their own websites, sometimes without ever
# filing an award notice - Radboud's ten-year CRIS award to Vidatum
# (13 Apr 2026) appeared only on ru.nl, never on TED or TenderNed, and has
# no Google News coverage at all. Neither tenders.yml nor news-scan.yml can
# see that class of announcement. This workflow is the channel that can.

on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: institution-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run institution news scan
        id: scan
        run: python scripts/institution_news_scan.py
      - name: Commit findings
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # Stage only what exists. The scan writes institution-news.json on
          # every run now, but naming a missing path here aborts the whole job
          # with exit 128 — which is exactly how the first Denmark and Belgium
          # runs failed, on a scan that had worked perfectly and simply had
          # nothing to report.
          for f in data/institution-news.json data/institution-news-state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "institution-news: auto-scan $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent run) - retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push institution-news results after 3 attempts. This run's findings were not saved; the next scan will re-find anything still listed, because the seen-URL state was not committed either."

      - name: Open notification issue
        if: steps.scan.outputs.new_count
        uses: actions/github-script@v7
        env:
          NEW_COUNT: ${{ steps.scan.outputs.new_count }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
        with:
          script: |
            // Headlines come from external institution websites - read via env,
            // never interpolated into this script, so nothing in a scraped
            // headline can affect what code runs here.
            const total = Number(process.env.NEW_COUNT || 0);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📢 ${total} new Belgium research-system announcement(s)`,
              body: process.env.SUMMARY,
              labels: ['rfp-alert', 'institution-news']
            });
