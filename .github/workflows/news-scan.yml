name: Daily Belgium Research News Scan

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run news scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/news-scan.js
      - name: Commit new news findings
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/news.json data/news-scan-state.json
          git diff --staged --quiet || git commit -m "news-scan: auto-scan $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
