name: Daily OpenAlex Subscription Scan

# Per-institution since 2026-09-18: a rotating batch of institutions each
# gets its own Claude web search, plus a country-level search once a week.
# The old single call over every institution found nothing for a week.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Institutions to check this run'
        default: '6'
        required: false
      dry_run:
        description: 'Search and log only, write nothing (true/false)'
        default: 'false'
        required: false
      inst:
        description: 'Only these institution ids, comma-separated (skips the rotation)'
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: openalex-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run OpenAlex subscription scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          EXTRA="--batch ${{ github.event.inputs.batch || '6' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ -n "${{ github.event.inputs.inst }}" ]; then EXTRA="$EXTRA --inst ${{ github.event.inputs.inst }}"; fi
          node scripts/openalex-subscription-scan.js $EXTRA
      - name: Commit new OpenAlex subscription findings
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/openalex-subscriptions.json data/openalex-scan-state.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "openalex-scan: auto-scan $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent run of this workflow) — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push openalex-scan results after 3 attempts, likely racing a concurrent run of this same workflow (e.g. the manual button and a scheduled/API trigger firing close together). This run's findings were not saved, but the concurrency guard means it won't happen from overlapping scheduled runs alone, and any real update will likely resurface in the next scan."

