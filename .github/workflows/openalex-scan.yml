name: Daily OpenAlex Subscription Scan

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openalex-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run OpenAlex subscription scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/openalex-subscription-scan.js
      - name: Commit new OpenAlex subscription findings
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/openalex-subscriptions.json data/openalex-scan-state.json
          git diff --staged --quiet || git commit -m "openalex-scan: auto-scan $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
