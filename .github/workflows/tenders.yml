name: Daily Tender Scan

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tender scraper
        id: scan
        run: python scraper/tender_scraper.py
      - name: Commit new tenders
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/tenders.json data/tenders-scan-state.json
          git diff --staged --quiet || git commit -m "tenders: auto-scan $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
      - name: Open notification issue for new tenders
        if: steps.scan.outputs.new_count
        uses: actions/github-script@v7
        env:
          NEW_COUNT: ${{ steps.scan.outputs.new_count }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
        with:
          script: |
            // Tender text comes from external sources (TED Europa, TenderNed) —
            // read via env, not interpolated into the script, so nothing in a
            // scraped title/notes can affect what code actually runs here.
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔔 ${process.env.NEW_COUNT} new Belgium tender(s) competing with Elsevier`,
              body: process.env.SUMMARY,
              labels: ['rfp-alert']
            });
