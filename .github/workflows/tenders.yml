name: Daily Tender Scan

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tenders-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tender scraper
        id: scan
        run: python scraper/tender_scraper.py
      - name: Commit new tenders
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/tenders.json data/tenders-scan-state.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "tenders: auto-scan $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent run of this workflow) — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push tenders results after 3 attempts, likely racing a concurrent run of this same workflow (e.g. the manual button and a scheduled/API trigger firing close together). This run's findings were not saved, but the concurrency guard means it won't happen from overlapping scheduled runs alone, and any real update will likely resurface in the next scan."

      - name: Open notification issue for new tenders
        if: steps.scan.outputs.new_count
        uses: actions/github-script@v7
        env:
          NEW_COUNT: ${{ steps.scan.outputs.new_count }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
        with:
          script: |
            // Tender text comes from external sources (TED Europa, TenderNed) —
            // read via env, not interpolated into the script, so nothing in a
            // scraped title/notes can affect what code actually runs here.
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔔 ${process.env.NEW_COUNT} new Belgium tender(s) competing with Elsevier`,
              body: process.env.SUMMARY,
              labels: ['rfp-alert']
            });
